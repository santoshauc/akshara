# SchoolErp continuous integration.
#
# backend  — build the whole solution (API + portal) and run every test;
#            integration tests use Testcontainers, which works out of the box
#            on ubuntu runners (Docker is preinstalled).
# vulnscan — fail on High/Critical package advisories that are not in the
#            accepted list (docs/security-notes.md).
# mobile   — type-check the two Expo apps.
# docker   — prove the API image builds.

name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SchoolErp.sln

      - name: Build
        run: dotnet build SchoolErp.sln --no-restore --configuration Release

      # ReportGenerator merges the unit and integration cobertura reports into
      # one figure. Measuring either run alone understates the suite badly.
      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      # scripts/coverage.ps1 is the same script developers run locally, so the
      # number here and the number on a dev box are produced identically. It
      # fails the job if the collector produces no coverage files — that failure
      # was silent for a whole session once, and read as "0.6% coverage".
      - name: Test (unit + integration via Testcontainers) with coverage
        run: pwsh scripts/coverage.ps1 -Configuration Release -NoBuild

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: TestResults/merged
          if-no-files-found: warn

  vulnscan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SchoolErp.sln

      - name: Fail on unaccepted High/Critical advisories
        run: |
          set -euo pipefail

          # The scan's own failure must fail the step. This previously ended in
          # "|| true", so a broken restore or an unreachable NuGet produced an
          # EMPTY report, no High/Critical lines were found in it, and the gate
          # went green having scanned nothing at all. A check that cannot tell
          # "nothing vulnerable" from "never ran" is worse than no check.
          # (`dotnet list --vulnerable` exits 0 when it finds advisories and
          # non-zero only when it genuinely fails, so pipefail is safe here.)
          dotnet list SchoolErp.sln package --vulnerable --include-transitive | tee vulns.txt

          # Liveness: every project prints either "has no vulnerable packages"
          # or "has the following vulnerable packages". No such line means the
          # output is not a report, whatever the exit code claimed.
          if ! grep -q "vulnerable packages" vulns.txt; then
            echo "::error::Vulnerability scan produced no recognisable report - refusing to pass."
            exit 1
          fi

          # Advisories we have consciously accepted, as regex alternatives
          # (e.g. 'GHSA-aaaa-bbbb-cccc|GHSA-dddd-eeee-ffff'). Every entry must be
          # justified in docs/security-notes.md. Empty on purpose: nothing
          # High/Critical is currently accepted. The two open OpenTelemetry
          # advisories are Moderate and sit below this threshold, so they do not
          # belong here.
          ACCEPTED=''

          if [ -n "$ACCEPTED" ]; then
            BAD=$(grep -E '\b(High|Critical)\b' vulns.txt | grep -vE "$ACCEPTED" || true)
          else
            BAD=$(grep -E '\b(High|Critical)\b' vulns.txt || true)
          fi

          if [ -n "$BAD" ]; then
            echo "::error::Unaccepted High/Critical advisories (see docs/security-notes.md):"
            echo "$BAD"
            exit 1
          fi

  mobile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [parent-app, driver-app]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/${{ matrix.app }}/package-lock.json

      - name: Install
        working-directory: mobile/${{ matrix.app }}
        run: npm ci

      - name: Type-check
        working-directory: mobile/${{ matrix.app }}
        run: npx tsc --noEmit

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f deployment/Dockerfile.api -t schoolerp-api:ci .
