# Local development stack. Credentials here are for local use only —
# production secrets come from the environment / secret manager.
services:
  postgres:
    image: postgres:16-alpine
    container_name: schoolerp-postgres
    environment:
      POSTGRES_DB: schoolerp
      POSTGRES_USER: schoolerp
      POSTGRES_PASSWORD: schoolerp_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolerp -d schoolerp"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: schoolerp-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Full-stack profile: `docker compose --profile full up -d --build` also
  # builds and runs the API container. The default `up -d` starts only the
  # data services — the usual dev flow runs the API via `dotnet run`.
  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.api
    container_name: schoolerp-api
    profiles: ["full"]
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=schoolerp;Username=schoolerp_app;Password=schoolerp_app_dev_only
      ConnectionStrings__PostgresMigrations: Host=postgres;Port=5432;Database=schoolerp;Username=schoolerp;Password=schoolerp_dev_only
      ConnectionStrings__Redis: redis:6379
      Jwt__SigningKey: local-compose-signing-key-0123456789abcdef
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
